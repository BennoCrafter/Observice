name: Build image

# Push a v* tag to publish a GitHub Release with the flashable image attached.
# Run manually to get the image as a workflow artifact (newest release, or the ref you enter).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Observice git ref to bake in (empty = newest v* release)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils p7zip-full qemu-user-binfmt python3-git python3-yaml file xz-utils

      - name: Checkout CustomPiOS
        uses: actions/checkout@v4
        with:
          repository: guysoft/CustomPiOS
          ref: 70f78ee8e52906595bf6dfb4941c241ede1e7246  # devel as of 2026-11-18; bump deliberately
          path: CustomPiOS

      - name: Checkout Observice
        uses: actions/checkout@v4
        with:
          path: observice

      - name: Download base image
        run: |
          cd observice/image/src
          ../../../CustomPiOS/src/update-custompios-paths
          export DIST_PATH=$(pwd) CUSTOM_PI_OS_PATH=$(cat custompios_path)
          $CUSTOM_PI_OS_PATH/base_image_downloader_wrapper.sh

      - name: Build image
        env:
          OBSERVICE_REF: ${{ github.ref_type == 'tag' && github.ref_name || inputs.ref }}
        run: |
          sudo modprobe loop
          cd observice/image/src
          sudo OBSERVICE_REF="$OBSERVICE_REF" bash -x ./build_dist

      - name: Compress and write Imager repository
        id: out
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          NAME="observice-$TAG-arm64.img"
          sudo mv observice/image/src/workspace/*.img "$NAME"
          sudo chown "$USER:" "$NAME"  # owner and group, or xz fails copying the group
          EXTRACT_SIZE=$(stat -c %s "$NAME")
          EXTRACT_SHA=$(sha256sum "$NAME" | cut -d' ' -f1)
          xz -T0 -6 "$NAME"
          # Imager only offers OS customisation (user, Wi-Fi, SSH) for repository entries with an init_format;
          # cloudinit-rpi matches the trixie Raspberry Pi OS base. Users add this file under Image Repository.
          jq -n --arg name "Observice $TAG" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$NAME.xz" \
            --argjson extract_size "$EXTRACT_SIZE" --arg extract_sha "$EXTRACT_SHA" \
            --argjson download_size "$(stat -c %s "$NAME.xz")" --arg download_sha "$(sha256sum "$NAME.xz" | cut -d' ' -f1)" \
            --arg date "$(date +%F)" \
            '{os_list: [{
              name: $name,
              description: "Camera watcher: RTSP stream, motion alerts, Home Assistant. Panel at http://observice.local",
              icon: "https://raw.githubusercontent.com/BennoCrafter/Observice/main/assets/observice.png",
              url: $url, extract_size: $extract_size, extract_sha256: $extract_sha,
              image_download_size: $download_size, image_download_sha256: $download_sha,
              release_date: $date, init_format: "cloudinit-rpi",
              devices: ["pi5-64bit", "pi4-64bit", "pi3-64bit"]
            }]}' > observice.rpi-imager.json
          echo "file=$NAME.xz" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.out.outputs.file }}" observice.rpi-imager.json --repo "${{ github.repository }}" --generate-notes

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: observice-image
          path: ${{ steps.out.outputs.file }}
