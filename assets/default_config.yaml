camera:
  width: 1280
  height: 720
  framerate: 30
  rtsp_port: 8554
  device: "" # Linux only: v4l2 device path, e.g. /dev/video2. Empty = /dev/video0.

motion:
  enabled: true
  check_interval: 60 # seconds between frame comparisons
  threshold: 25 # mean pixel-diff above this counts as "changed"

discord:
  enabled: false
  webhook_url: ""
  token: "" # only needed for scripts/download_discord_images.py
  listening_users: [] # Discord user ids to @-mention when an image is sent (int)

mqtt:
  enabled: true
  host: homeassistant.local
  port: 1883
  username: ""
  password: ""
  base_topic: observice/camera
