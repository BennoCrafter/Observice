<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observice</title>
<style>
  :root {
    --bg: #f4f4f2; --card: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e2e2dd;
    --accent: #2f6fde; --on-accent: #ffffff; --ok: #1f9d55; --bad: #d64545; --warn: #c98a12; --code: #f7f7f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --card: #1c1c1b; --text: #ececea; --muted: #9a9a94; --line: #2e2e2c;
            --accent: #6b9bf2; --on-accent: #0d1626; --ok: #3ccf7d; --bad: #f06a6a; --warn: #e8b34a; --code: #151514; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px;
          border-radius: 99px; background: var(--card); border: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.active { background: var(--ok); } .dot.failed, .dot.inactive { background: var(--bad); }
  .dot.activating { background: var(--warn); }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 16px;
         padding: 16px 24px 32px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 14px 16px; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; align-self: start; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .feed { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 8px; display: block; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 14px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: .55; cursor: progress; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 12px 0 0;
        font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
        max-height: 420px; overflow-y: auto; }
  pre:empty { display: none; }
  pre.logpane { margin: 0; height: min(72vh, 760px); max-height: none; font-size: 12.5px; }
  .stack { display: grid; gap: 16px; align-content: start; }
  details { border-bottom: 1px solid var(--line); }
  details:last-child { border-bottom: 0; margin-bottom: 10px; }
  summary { cursor: pointer; padding: 8px 2px; font-size: 14px; font-weight: 600; text-transform: capitalize; }
  details[open] { padding-bottom: 8px; }
  label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; margin-top: 5px; font-size: 13px; }
  label span { color: var(--muted); overflow-wrap: anywhere; }
  input[type=text], input[type=number], input[type=password] { font: inherit; font-size: 13px; width: 100%;
         padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=checkbox] { width: 18px; height: 18px; justify-self: start; accent-color: var(--accent); }
  .msg { font-size: 14px; margin-top: 10px; } .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  meter:not([hidden]) { display: block; width: 100%; max-width: 180px; height: 8px; margin-top: 4px; }
  ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Observice</h1>
  <span class="pill"><span class="dot" id="dot"></span><span id="state">…</span></span>
</header>
<main>
  <section>
    <h2>Live feed</h2>
    <img class="feed" src="/stream.mjpg" alt="Live camera feed">
  </section>

  <div class="stack">
    <section>
      <h2>Service</h2>
      <dl>
        <dt>Running since</dt><dd id="since">–</dd>
        <dt>Restarts</dt><dd id="restarts">–</dd>
        <dt>Version</dt><dd id="commit">–</dd>
        <dt>Wi-Fi</dt><dd><span id="wifi">–</span><meter id="wifi-meter" min="0" max="100" low="40" high="60" optimum="100" hidden></meter></dd>
      </dl>
      <div class="row"><button id="restart">Restart camera service</button></div>
      <p class="msg" id="restart-msg" role="status"></p>
    </section>

    <section>
      <h2>Updates</h2>
      <div class="row">
        <button id="check">Check for updates</button>
        <button id="update" class="primary">Update &amp; restart</button>
      </div>
      <p class="msg" id="update-msg" role="status"></p>
      <ul id="pending"></ul>
      <pre id="update-out"></pre>
    </section>
  </div>

  <section>
    <h2>Logs</h2>
    <pre id="logs" class="logpane">Loading…</pre>
  </section>

  <section>
    <h2>Configuration</h2>
    <form id="config"></form>
    <div class="row"><button id="save" class="primary" type="button">Save &amp; restart</button></div>
    <p class="msg" id="config-msg" role="status"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const SECRET = /password|token|webhook/;

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "X-Observice": "1", "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ ok: false, output: `HTTP ${res.status}` }));
  return data;
}

function say(id, ok, text) {
  $(id).className = "msg " + (ok ? "ok" : "bad");
  $(id).textContent = text;
}

async function busy(button, fn) {
  button.disabled = true;
  try { await fn(); } catch (e) { console.error(e); } finally { button.disabled = false; }
}

async function refreshStatus() {
  try {
    const s = await api("/api/status");
    $("state").textContent = s.state || "unknown";
    $("dot").className = "dot " + s.state;
    $("since").textContent = s.since || "–";
    $("restarts").textContent = s.restarts || "–";
    $("commit").textContent = s.commit || "–";
    const w = s.wifi;
    $("wifi").textContent = w ? `${w.ssid} · ${w.signal}%${w.dbm != null ? ` (${w.dbm} dBm)` : ""}` : "not connected";
    $("wifi-meter").hidden = !w;
    if (w) $("wifi-meter").value = w.signal;
    const logs = $("logs"), atBottom = logs.scrollHeight - logs.scrollTop - logs.clientHeight < 40;
    logs.textContent = s.logs || "(no log output)";
    if (atBottom) logs.scrollTop = logs.scrollHeight;
  } catch {
    $("state").textContent = "panel unreachable";
    $("dot").className = "dot failed";
  }
}

async function loadConfig() {
  const config = await api("/api/config");
  const form = $("config");
  form.replaceChildren();
  for (const [section, values] of Object.entries(config)) {
    const fs = document.createElement("details");
    fs.innerHTML = `<summary>${section}</summary>`;
    for (const [key, value] of Object.entries(values)) {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.dataset.section = section;
      input.dataset.key = key;
      if (typeof value === "boolean") {
        input.type = "checkbox"; input.checked = value; input.dataset.kind = "bool";
      } else if (typeof value === "number") {
        input.type = "number"; input.step = "any"; input.value = value; input.dataset.kind = "number";
      } else if (Array.isArray(value)) {
        input.type = "text"; input.value = value.join(", "); input.dataset.kind = "list";
        input.placeholder = "comma-separated IDs";
      } else {
        input.type = SECRET.test(key) ? "password" : "text"; input.value = value; input.dataset.kind = "text";
        input.autocomplete = "off";
      }
      label.append(Object.assign(document.createElement("span"), { textContent: key.replaceAll("_", " ") }), input);
      fs.append(label);
    }
    form.append(fs);
  }
}

function readConfig() {
  const config = {};
  for (const input of $("config").querySelectorAll("input")) {
    const { section, key, kind } = input.dataset;
    let value = input.value;
    if (kind === "bool") value = input.checked;
    else if (kind === "number") value = Number(value);
    else if (kind === "list") value = value.split(",").map(v => v.trim()).filter(Boolean).map(Number);
    (config[section] ??= {})[key] = value;
  }
  return config;
}

$("save").onclick = e => busy(e.target, async () => {
  const r = await api("/api/config", readConfig());
  say("config-msg", r.ok, r.output);
  refreshStatus();
});

$("restart").onclick = e => busy(e.target, async () => {
  const r = await api("/api/restart", {});
  say("restart-msg", r.ok, r.ok ? "Camera service restarted." : r.output);
  refreshStatus();
});

$("check").onclick = e => busy(e.target, async () => {
  const r = await api("/api/updates");
  $("pending").replaceChildren(...(r.pending || []).map(c => Object.assign(document.createElement("li"), { textContent: c })));
  if (!r.ok) say("update-msg", false, r.output);
  else say("update-msg", true, r.pending.length ? `${r.latest} available (${r.pending.length} new commit(s)).` : "Up to date.");
});

$("update").onclick = e => busy(e.target, async () => {
  if (!confirm("Update to the latest release and restart Observice?")) return;
  say("update-msg", true, "Updating… this can take a minute.");
  const r = await api("/api/update", {});
  $("update-out").textContent = r.output;
  say("update-msg", r.ok, r.ok ? "Updated. The panel restarts itself — reloading shortly." : "Update failed, see output.");
  if (r.ok) setTimeout(() => location.reload(), 4000);
});

loadConfig().catch(() => say("config-msg", false, "Could not load config."));
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
